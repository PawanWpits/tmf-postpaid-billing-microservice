spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#HB-config
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true

# Kafka config
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=customer-bill-app
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
app.kafka.topics.billing-cycle-specification=account-management.billingCycleSpecification.events
app.kafka.topics.billing-account=account-management.billingAccount.events
app.kafka.topics.billing-cycle-closed=customer-bill.billingCycleClosed.events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
account-management.base-url=http://localhost:8080/tmf-api/accountManagement/v5

#billing.cycle.scheduler.enabled=true
#billing.cycle.scheduler.cron=0 0 0 * * *
#billing.cycle.scheduler.zone=Asia/Kolkata
billing.simulator.base-url=http://localhost:8082