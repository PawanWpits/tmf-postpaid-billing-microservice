spring.application.name=account-management-app

server.servlet.context-path=/tmf-api/accountManagement/v5
app.base-url=http://localhost:8080/tmf-api/accountManagement/v5

spring.profiles.active=dev

# ---- Jackson ----
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Kafka topics (TMF666 resource event topics) ----
app.kafka.topics.bill-format=account-management.billFormat.events
app.kafka.topics.party-account=account-management.partyAccount.events
app.kafka.topics.billing-account=account-management.billingAccount.events
app.kafka.topics.financial-account=account-management.financialAccount.events
app.kafka.topics.settlement-account=account-management.settlementAccount.events
app.kafka.topics.bill-presentation-media=account-management.billPresentationMedia.events
app.kafka.topics.billing-cycle-specification=account-management.billingCycleSpecification.events
